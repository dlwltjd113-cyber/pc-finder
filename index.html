<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC 파인더</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 16px;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 640px;
      margin: auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #00000010;
    }

    h1 { margin-top: 0; }
    p { line-height: 1.7; }

    label {
      display: block;
      margin-top: 22px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select, button {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 26px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    #result {
      margin-top: 26px;
      padding: 20px;
      background: #eff6ff;
      border-radius: 12px;
    }

    #result h2 { margin-top: 0; }
    li { margin-bottom: 12px; line-height: 1.5; }
    .note { color: #526176; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>🖥️ PC 파인더</h1>
    <p>게임과 예산을 선택하고 추천 PC 구성을 확인해 보세요.</p>

    <form id="finder">
      <label for="game">주로 하는 게임</label>
      <select id="game">
        <option value="lol">리그 오브 레전드</option>
        <option value="valorant">발로란트</option>
        <option value="pubg">배틀그라운드</option>
        <option value="aaa">고사양 스팀 게임</option>
      </select>

      <label for="budget">본체 예산</label>
      <select id="budget">
        <option value="entry">약 70만~100만 원</option>
        <option value="mid">약 100만~150만 원</option>
        <option value="high">약 150만~200만 원</option>
      </select>

      <button type="submit">추천 구성 보기</button>
    </form>

    <section id="result" aria-live="polite" hidden></section>

    <p class="note">
      본체 기준의 참고용 구성입니다. 모니터·주변기기·운영체제 비용은
      별도이며, 실제 가격과 성능은 구매 시점과 게임 설정에 따라 달라집니다.
    </p>
  </main>

  <script>
  // 예산별 기본 구성: 실시간 가격이 아닌 참고용 예시입니다.
  const baseBuilds = {
    entry: {
      cpu: "AMD Ryzen 5 5600",
      board: "B550 메인보드",
      ssd: "NVMe SSD 1TB",
      power: "정격 550W 이상 권장"
    },
    mid: {
      cpu: "AMD Ryzen 5 7500F",
      board: "B650 메인보드",
      ssd: "NVMe SSD 1TB",
      power: "정격 650W 이상 권장"
    },
    high: {
      cpu: "AMD Ryzen 5 7500F",
      board: "B650 메인보드",
      ssd: "NVMe SSD 1TB",
      power: "정격 750W 이상 권장"
    }
  };

  // 게임별로 그래픽카드와 메모리를 다르게 추천합니다.
  const gameBuilds = {
    lol: {
      entry: { gpu: "AMD Radeon RX 6600", ram: "DDR4 16GB (8GB × 2)" },
      mid: { gpu: "NVIDIA GeForce RTX 4060", ram: "DDR5 32GB (16GB × 2)" },
      high: { gpu: "NVIDIA GeForce RTX 4060", ram: "DDR5 32GB (16GB × 2)" },
      note: "롤 위주라면 예산을 전부 쓸 필요는 없어요. 높은 예산에서도 그래픽카드를 과하게 올리기보다는 모니터나 주변기기에 예산을 남기는 구성입니다."
    },
    valorant: {
      entry: { gpu: "AMD Radeon RX 6600", ram: "DDR4 16GB (8GB × 2)" },
      mid: { gpu: "NVIDIA GeForce RTX 4060", ram: "DDR5 32GB (16GB × 2)" },
      high: { gpu: "NVIDIA GeForce RTX 4060", ram: "DDR5 32GB (16GB × 2)" },
      note: "발로란트 위주의 절약형 구성입니다. 높은 주사율을 목표로 한다면 그래픽카드뿐 아니라 CPU 성능과 모니터 주사율도 함께 확인하세요."
    },
    pubg: {
      entry: { gpu: "AMD Radeon RX 6600", ram: "DDR4 32GB (16GB × 2)" },
      mid: { gpu: "NVIDIA GeForce RTX 4060", ram: "DDR5 32GB (16GB × 2)" },
      high: { gpu: "NVIDIA GeForce RTX 4070 SUPER", ram: "DDR5 32GB (16GB × 2)" },
      note: "배틀그라운드는 메모리 여유를 고려해 32GB로 구성했어요. 해상도와 그래픽 옵션에 따라 프레임 차이가 크므로 목표 설정에 맞는 성능 확인이 필요합니다."
    },
    aaa: {
      entry: { gpu: "AMD Radeon RX 6600", ram: "DDR4 32GB (16GB × 2)" },
      mid: { gpu: "NVIDIA GeForce RTX 4060", ram: "DDR5 32GB (16GB × 2)" },
      high: { gpu: "NVIDIA GeForce RTX 4070 SUPER", ram: "DDR5 32GB (16GB × 2)" },
      note: "고사양 게임은 그래픽카드 비중을 높인 구성입니다. 낮은 예산에서는 옵션 조절이 필요할 수 있으며, 구매 전 플레이할 게임의 권장 사양을 확인하세요."
    }
  };

  document.getElementById("finder").addEventListener("submit", function(event) {
    event.preventDefault();

    const game = document.getElementById("game");
    const budget = document.getElementById("budget");
    const result = document.getElementById("result");

    const gamePlan = gameBuilds[game.value];

    // 예산별 기본 부품 + 게임별 부품을 합칩니다.
    const build = {
      ...baseBuilds[budget.value],
      ...gamePlan[budget.value]
    };

    result.innerHTML = `
      <h2>🎯 게임 맞춤 추천 구성</h2>

      <p>
        <strong>${game.options[game.selectedIndex].text}</strong><br>
        선택 예산: ${budget.options[budget.selectedIndex].text}
      </p>

      <ul>
        <li><strong>CPU:</strong> ${build.cpu}</li>
        <li><strong>그래픽카드:</strong> ${build.gpu}</li>
        <li><strong>메모리:</strong> ${build.ram}</li>
        <li><strong>저장장치:</strong> ${build.ssd}</li>
        <li><strong>메인보드:</strong> ${build.board}</li>
        <li><strong>파워:</strong> ${build.power}</li>
      </ul>

      <p><strong>💡 추천 이유</strong><br>${gamePlan.note}</p>

      <p class="note">
        예산 구간별 참고용 예시이며 실시간 견적이 아닙니다.
        현재 판매 가격에 따라 선택 예산을 초과할 수 있습니다.
        케이스·쿨러·조립비·운영체제 비용과 부품 호환성을
        구매 전에 확인하세요. 특정 프레임을 보장하지 않습니다.
      </p>
    `;

    result.hidden = false;
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  });
</script>
</body>
</html>
